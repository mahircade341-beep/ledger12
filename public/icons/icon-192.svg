<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#080e1a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="192" height="192" rx="32" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <rect x="10" y="10" width="172" height="172" rx="26" fill="none" stroke="rgba(59,130,246,0.12)" stroke-width="1"/>

  <!-- Main D letter mark -->
  <g transform="translate(96,96)">
    <rect x="-36" y="-40" width="72" height="80" rx="14" fill="url(#brandGrad)"
          filter="drop-shadow(0 4px 16px rgba(59,130,246,0.3))"/>

    <!-- Inner white D letter -->
    <path d="M-20 -28 L-20 28 
             C-20 28, -6 32, 8 28 
             C26 22, 34 8, 34 -6 
             C34 -20, 26 -32, 8 -32 
             C-6 -32, -20 -28, -20 -28Z" 
          fill="white" stroke="none" opacity="0.95"/>
  </g>
</svg>
