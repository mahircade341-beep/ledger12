<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#F43F5E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <!-- Outer ring glow -->
  <rect x="8" y="8" width="176" height="176" rx="30" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <!-- POS Terminal Icon -->
  <g transform="translate(96,88)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <!-- Monitor -->
    <rect x="-52" y="-48" width="104" height="72" rx="6" stroke-width="4.5"/>
    <!-- Screen content line 1 -->
    <line x1="-36" y1="-30" x2="-8" y2="-30" stroke-width="3.5" opacity="0.7"/>
    <line x1="-36" y1="-16" x2="-20" y2="-16" stroke-width="3.5" opacity="0.5"/>
    <!-- Screen content line 2 -->
    <line x1="6" y1="-30" x2="36" y2="-30" stroke-width="3.5" opacity="0.7"/>
    <line x1="6" y1="-16" x2="24" y2="-16" stroke-width="3.5" opacity="0.5"/>
    <!-- Price / Total -->
    <rect x="-32" y="4" width="64" height="14" rx="3" fill="url(#accent)" stroke="none"/>
    <!-- Stand -->
    <line x1="-16" y1="24" x2="-4" y2="40" stroke-width="4"/>
    <line x1="16" y1="24" x2="4" y2="40" stroke-width="4"/>
    <!-- Base -->
    <rect x="-20" y="40" width="40" height="6" rx="3" stroke-width="4"/>
  </g>
</svg>
