<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- V2 Brand Gradient: blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#0c1322"/>
      <stop offset="100%" style="stop-color:#080e1a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(96,165,250,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(59,130,246,0.05)"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Subtle grid overlay -->
  <rect width="512" height="512" rx="80" fill="url(#grid)"/>

  <!-- Glow behind icon -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>

  <!-- Outer ring -->
  <rect x="24" y="24" width="464" height="464" rx="64" fill="none" stroke="rgba(59,130,246,0.1)" stroke-width="1.5"/>

  <!-- Main D letter mark container -->
  <g transform="translate(256,256)">
    <rect x="-92" y="-104" width="184" height="208" rx="32" fill="url(#brandGrad)" 
          filter="drop-shadow(0 8px 32px rgba(59,130,246,0.35))"/>

    <!-- Inner white D letter -->
    <path d="M-48 -72 L-48 72 
             C-48 72, -12 80, 24 72 
             C72 60, 88 24, 88 -12 
             C88 -48, 72 -80, 24 -80 
             C-12 -80, -48 -72, -48 -72Z" 
          fill="white" stroke="none" opacity="0.95"/>
    
    <!-- Inner subtle D for depth -->
    <path d="M-32 -56 L-32 56 
             C-32 56, -4 62, 20 56 
             C56 46, 68 18, 68 -10 
             C68 -38, 56 -64, 20 -64 
             C-4 -64, -32 -56, -32 -56Z" 
          fill="none" stroke="rgba(15,23,42,0.08)" stroke-width="2"/>
  </g>

  <!-- Bottom bar accent - POS terminal hint -->
  <g transform="translate(256,436)">
    <rect x="-60" y="-6" width="120" height="12" rx="6" fill="url(#brandGrad)" opacity="0.3"/>
  </g>

  <!-- Top-right brand dot -->
  <circle cx="420" cy="92" r="6" fill="rgba(96,165,250,0.4)"/>
  <circle cx="440" cy="92" r="3" fill="rgba(96,165,250,0.2)"/>
</svg>
