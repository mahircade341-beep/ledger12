<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#F43F5E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <!-- Outer ring glow -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.25"/>
  <!-- POS Terminal Icon -->
  <g transform="translate(256,236)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor -->
    <rect x="-140" y="-130" width="280" height="196" rx="12" stroke-width="10"/>
    <!-- Screen glow -->
    <rect x="-112" y="-108" width="224" height="148" rx="6" fill="rgba(59,130,246,0.06)" stroke="none"/>
    <!-- Screen content - left column -->
    <line x1="-96" y1="-82" x2="-24" y2="-82" stroke-width="7" opacity="0.6"/>
    <line x1="-96" y1="-52" x2="-48" y2="-52" stroke-width="7" opacity="0.4"/>
    <line x1="-96" y1="-22" x2="-64" y2="-22" stroke-width="7" opacity="0.3"/>
    <!-- Screen content - right column -->
    <line x1="16" y1="-82" x2="96" y2="-82" stroke-width="7" opacity="0.6"/>
    <line x1="16" y1="-52" x2="72" y2="-52" stroke-width="7" opacity="0.4"/>
    <line x1="16" y1="-22" x2="40" y2="-22" stroke-width="7" opacity="0.3"/>
    <!-- Price bar -->
    <rect x="-86" y="8" width="172" height="36" rx="6" fill="url(#accent)" stroke="none"/>
    <!-- Stand -->
    <line x1="-44" y1="66" x2="-12" y2="108" stroke-width="10"/>
    <line x1="44" y1="66" x2="12" y2="108" stroke-width="10"/>
    <!-- Base -->
    <rect x="-54" y="108" width="108" height="16" rx="6" stroke-width="10"/>
  </g>
</svg>
